[map]
folder = "map.w3x"
entry = "src/main.yue"

[build]
folder = "dist/bin"
minify = false

[lint]
unknownGlobals = "error"
globals = []

[assets]
exclude = []

[settings.info]
name = "Moonwell Gate"
preview = "preview.png"

[settings.loadingScreen]
title = "Moonwell Gate Loading"

[settings.gameplay]
heroMaxLevel = 7
foodLimit = 42

[settings.environment]
soundEnvironment = "Dungeon"
waterColor = [255, 0, 0, 255]

[settings.environment.fog]
enabled = true
start = 500
end = 3000
color = [255, 0, 0, 255]

[[settings.players]]
slot = 0
name = "Gate Player"
race = "orc"
fixedStart = true
