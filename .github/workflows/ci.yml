name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkl-asset: pkl-linux-amd64
            pkl-binary: pkl
          - os: windows-latest
            pkl-asset: pkl-windows-amd64.exe
            pkl-binary: pkl.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The Windows runner checks out on D: but keeps temp folders on C:. Tests create linked projects in temp
      # folders, and `init --link` needs them on the checkout's drive (Pkl cannot load a local dependency across drives).
      - name: Keep temp folders on the checkout's drive
        if: runner.os == 'Windows'
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key a cache on

      - name: Install Pkl 0.32.1
        run: |
          mkdir -p "$RUNNER_TEMP/pkl"
          curl -fsSL -o "$RUNNER_TEMP/pkl/${{ matrix.pkl-binary }}" \
            "https://github.com/apple/pkl/releases/download/0.32.1/${{ matrix.pkl-asset }}"
          chmod +x "$RUNNER_TEMP/pkl/${{ matrix.pkl-binary }}"
          echo "$RUNNER_TEMP/pkl" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pkl/${{ matrix.pkl-binary }}" --version

      - run: pkl --version
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi
      # A missing pkl or YueScript compiler fails a test instead of skipping it; the compiler is downloaded once.
      - run: go test ./...
        env:
          MOONWELL_REQUIRE_TOOLS: "1"
          MOONWELL_NETWORK_TESTS: "1"
